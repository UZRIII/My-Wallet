<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محفظة الأسهم</title>
    <style>
        body { font-family: system-ui, sans-serif; background-color: #0b1d19; color: #fff; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: #0f2b26; padding: 20px; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; text-align: center; }
        th, td { padding: 12px; border: 1px solid #1a423b; }
        th { background-color: #143831; color: #a5d6a7; }
        input, select, button { padding: 8px; margin: 5px; border-radius: 5px; border: 1px solid #1a423b; background: #183e36; color: #fff; }
        button { background: #e0a96d; color: #000; font-weight: bold; cursor: pointer; border: none; }
        .profit { color: #4caf50; font-weight: bold; }
        .loss { color: #ff5252; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>محفظة الأسهم</h2>
    
    <!-- نموذج إضافة سهم -->
    <div>
        <select id="stockSelect" onchange="onStockChange()">
            <option value="">اختر السهم</option>
            <option value="ORAS">ORAS - أوراسكوم كونستراكشون</option>
            <option value="ETEL">ETEL - المصرية للاتصالات</option>
        </select>
        <input type="number" id="quantity" placeholder="الكمية" value="1">
        <input type="number" id="buyPrice" placeholder="متوسط سعر الشراء">
        <input type="number" id="currentPrice" placeholder="السعر الحالي (تلقائي)" readonly>
        <input type="number" id="targetPrice" placeholder="السعر المستهدف">
        <button onclick="addStock()">إضافة سهم</button>
    </div>

    <!-- جدول المحفظة -->
    <table>
        <thead>
            <tr>
                <th>السهم</th>
                <th>الكمية</th>
                <th>متوسط الشراء</th>
                <th>السعر الحالي (الإغلاق)</th>
                <th>السعر المستهدف</th>
                <th>القيمة الحالية</th>
                <th>الربح / الخسارة</th>
                <th>إجراء</th>
            </tr>
        </thead>
        <tbody id="portfolioTable">
            <!-- يتم إضافة البيانات تلقائياً -->
        </tbody>
    </table>
</div>

<script>
    // بيانات البورصة المجلوبة (يتم جلب سعر الإغلاق تلقائياً بدلاً من آخر سعر)
    const egxMarketData = {
        "ORAS": { name: "ORAS - أوراسكوم كونستراكشون", closingPrice: 850.020 },
        "ETEL": { name: "ETEL - المصرية للاتصالات", closingPrice: 38.500 }
    };

    // بيانات المحفظة الحالية
    let portfolio = [
        { id: 1, symbol: "ORAS", name: "ORAS - أوراسكوم كونستراكشون", quantity: 1, buyPrice: 500.00, targetPrice: 1000.00 }
    ];

    // عند اختيار سهم من القائمة يُجلب سعر الإغلاق فوراً الخانة
    function onStockChange() {
        const symbol = document.getElementById('stockSelect').value;
        if (symbol && egxMarketData[symbol]) {
            document.getElementById('currentPrice').value = egxMarketData[symbol].closingPrice;
        } else {
            document.getElementById('currentPrice').value = '';
        }
    }

    // حساب قيم المحفظة وإعادة العرض
    function renderPortfolio() {
        const tbody = document.getElementById('portfolioTable');
        tbody.innerHTML = '';

        portfolio.forEach((item, index) => {
            // اعتماد سعر الإغلاق كسعر حالي للسهم
            const stockData = egxMarketData[item.symbol];
            const currentPrice = stockData ? stockData.closingPrice : 0;

            const totalValue = item.quantity * currentPrice;
            const totalCost = item.quantity * item.buyPrice;
            const profitLoss = totalValue - totalCost;
            const profitLossPercent = totalCost > 0 ? ((profitLoss / totalCost) * 100) : 0;

            const classColor = profitLoss >= 0 ? 'profit' : 'loss';
            const sign = profitLoss >= 0 ? '+' : '';

            tbody.innerHTML += `
                <tr>
                    <td>${item.name}</td>
                    <td>${item.quantity}</td>
                    <td>${item.buyPrice.toFixed(2)}</td>
                    <td><strong>${currentPrice.toFixed(2)}</strong></td>
                    <td>${item.targetPrice ? item.targetPrice.toFixed(2) : '-'}</td>
                    <td>${totalValue.toFixed(2)} ج.م</td>
                    <td class="${classColor}">${sign}${profitLoss.toFixed(2)} ج.م (${sign}${profitLossPercent.toFixed(1)}%)</td>
                    <td><button onclick="deleteStock(${index})" style="background:#ff5252; color:#fff;">حذف</button></td>
                </tr>
            `;
        });
    }

    // إضافة سهم جديد
    function addStock() {
        const symbol = document.getElementById('stockSelect').value;
        const quantity = parseFloat(document.getElementById('quantity').value);
        const buyPrice = parseFloat(document.getElementById('buyPrice').value);
        const targetPrice = parseFloat(document.getElementById('targetPrice').value) || 0;

        if (!symbol || !quantity || !buyPrice) {
            alert("يرجى اختيار السهم وإدخال الكمية وسعر الشراء");
            return;
        }

        portfolio.push({
            symbol: symbol,
            name: egxMarketData[symbol].name,
            quantity: quantity,
            buyPrice: buyPrice,
            targetPrice: targetPrice
        });

        renderPortfolio();
    }

    // حذف سهم
    function deleteStock(index) {
        portfolio.splice(index, 1);
        renderPortfolio();
    }

    // تشغيل التحديث فور فتح الصفحة
    window.onload = function() {
        renderPortfolio();
    };
</script>

</body>
</html>
